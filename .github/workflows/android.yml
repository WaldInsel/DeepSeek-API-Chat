name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ matrix.variant }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # standard：常规前端目标；legacy：面向 Android 9 旧版系统 WebView 的低内核产物
        variant: [standard, legacy]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # 发布签名材料；四个 secret 都配好才会生成签名包，否则 release 包保持未签名
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        if: matrix.variant == 'standard'
        run: pnpm build

      - name: Build legacy web assets
        if: matrix.variant == 'legacy'
        run: pnpm build:legacy

      - name: Add Android platform
        run: pnpm exec cap add android

      - name: Sync web assets
        run: pnpm exec cap sync android

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          ls -l android/app/release.keystore

      - name: Prepare native project
        run: node scripts/prepare-native.mjs

      - name: Build APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/app-${{ matrix.variant }}-debug.apk"
          for file in android/app/build/outputs/apk/release/*.apk; do
            cp "$file" "artifacts/app-${{ matrix.variant }}-$(basename "$file")"
          done
          ls -l artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.variant }}
          path: artifacts/
          retention-days: 14