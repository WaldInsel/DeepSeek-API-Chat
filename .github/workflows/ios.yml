name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # iOS 依赖不进仓库 lockfile，构建时按需安装
      - name: Install Capacitor iOS platform
        run: pnpm add -D @capacitor/ios@^7.6.10

      - name: Build web assets
        run: pnpm build

      - name: Add iOS platform
        run: pnpm exec cap add ios

      - name: Sync web assets
        run: pnpm exec cap sync ios

      - name: Prepare native project
        run: node scripts/prepare-ios.mjs

      # 关闭代码签名，产出未签名 .app；签名由用户在自己的机器上完成
      - name: Build unsigned app
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${IOS_SHORT_VERSION:-1.0}" \
            CURRENT_PROJECT_VERSION="${IOS_BUILD_VERSION:-1}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned ipa
        shell: bash
        run: |
          set -euo pipefail
          APP="ios/App/build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          if test -d "$APP/_CodeSignature" || codesign -dv "$APP" >/dev/null 2>&1; then
            echo "App.app is still signed, expected an unsigned build" >&2
            exit 1
          fi
          mkdir -p dist-ios/Payload
          cp -R "$APP" dist-ios/Payload/
          cd dist-ios
          zip -qry deepseek-api-chat-unsigned.ipa Payload
          ls -l

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist-ios/*.ipa
          if-no-files-found: error
          retention-days: 14
