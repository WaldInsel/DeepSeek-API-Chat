[package]
name = "deepseek-api-chat"
version = "0.1.1"
description = "DeepSeek API Chat desktop shell"
authors = ["DeepSeek API Chat"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "deepseek_api_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
